<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BX GB Pisco</title>
<meta name="description" content="Portal interno de gestión EMPRESA BX GB PISCO">
<meta name="theme-color" content="#312e81">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<!-- iPhone / iPad -->
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="BX GB">
<style>
  :root{--brand:#4f46e5;--brand2:#312e81;--bg:#f5f7fb;--line:#e4e7ec}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--brand2);font-family:Arial,Helvetica,sans-serif;overflow:hidden}
  .app{display:flex;flex-direction:column;height:100%;height:100dvh}
  .barra{flex:0 0 auto;display:flex;align-items:center;gap:10px;padding:8px 12px;
    padding-top:calc(8px + env(safe-area-inset-top));padding-left:calc(12px + env(safe-area-inset-left));padding-right:calc(12px + env(safe-area-inset-right));
    background:linear-gradient(90deg,var(--brand2),var(--brand));color:#fff}
  .barra img{width:30px;height:30px;border-radius:8px}
  .barra .titulo{flex:1;min-width:0;font-weight:800;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .barra button{border:0;background:rgba(255,255,255,.16);color:#fff;border-radius:9px;padding:7px 10px;font-weight:700;font-size:12px;cursor:pointer}
  .marco{flex:1 1 auto;position:relative;background:var(--bg)}
  iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:var(--bg)}
  .cargando{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;color:#475467;font-size:13px;background:var(--bg)}
  .giro{width:34px;height:34px;border:4px solid #c7d2fe;border-top-color:var(--brand);border-radius:50%;animation:g 0.8s linear infinite}
  @keyframes g{to{transform:rotate(360deg)}}
  .aviso{position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom));z-index:20;background:#fff;color:#182235;
    border-radius:16px;box-shadow:0 12px 32px rgba(0,0,0,.25);padding:14px 14px 12px;display:none;font-size:13px;max-width:460px;margin:0 auto}
  .aviso b{display:block;font-size:14px;margin-bottom:4px}
  .aviso .acciones{display:flex;gap:8px;justify-content:flex-end;margin-top:10px}
  .aviso button{border:0;border-radius:10px;padding:9px 14px;font-weight:700;font-size:12px;cursor:pointer}
  .aviso .si{background:var(--brand);color:#fff}
  .aviso .no{background:#f2f4f7;color:#344054}
  .sinred{position:fixed;inset:0;z-index:30;display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px;
    background:var(--bg);color:#182235;text-align:center;padding:24px}
  .sinred button{border:0;border-radius:10px;padding:10px 18px;font-weight:700;background:var(--brand);color:#fff}
</style>
</head>
<body>
<div class="app">
  <div class="barra">
    <img src="icon-192.png" alt="">
    <div class="titulo">EMPRESA BX GB PISCO</div>
    <button type="button" onclick="irAlInicio()" title="Volver al inicio del portal">⌂ Inicio</button>
    <button type="button" onclick="recargar()" title="Recargar">↻</button>
  </div>
  <div class="marco">
    <div class="cargando" id="cargando"><div class="giro"></div>Cargando el portal...</div>
    <iframe id="portal" title="Portal EMPRESA BX GB PISCO" allow="camera; geolocation; clipboard-write"></iframe>
  </div>
</div>

<!-- Aviso para instalar la app -->
<div class="aviso" id="avisoInstalar">
  <b>📲 Instalar la aplicación</b>
  <div id="textoInstalar">Agrega BX GB a tu pantalla de inicio para abrirla como una aplicación.</div>
  <div class="acciones">
    <button type="button" class="no" onclick="cerrarAviso()">Ahora no</button>
    <button type="button" class="si" id="btnInstalar" onclick="instalar()">Instalar</button>
  </div>
</div>

<!-- Sin conexión -->
<div class="sinred" id="sinRed">
  <div style="font-size:40px">📡</div>
  <div style="font-weight:800;font-size:16px">Sin conexión a internet</div>
  <div style="color:#667085;font-size:13px">El portal necesita internet para leer y guardar la información.</div>
  <button type="button" onclick="recargar()">Reintentar</button>
</div>

<script>
  // Dirección del portal (Google Apps Script). Las demás páginas se abren desde ahí.
  const PORTAL = 'https://script.google.com/macros/s/AKfycbw-e28vJzfvjoHFJpWz0Fp0POYZH2mUdbYnNEWb-iRR4LRrgj3p27bo72Kl5wzhC14vIg/exec';

  const marco = document.getElementById('portal');
  const cargando = document.getElementById('cargando');

  function irAlInicio(){
    cargando.style.display = 'flex';
    marco.src = PORTAL + (PORTAL.includes('?') ? '&' : '?') + 't=' + Date.now();
  }
  function recargar(){
    revisarRed();
    if (navigator.onLine) irAlInicio();
  }
  marco.addEventListener('load', () => { cargando.style.display = 'none'; });

  // ----- Sin conexión -----
  function revisarRed(){
    document.getElementById('sinRed').style.display = navigator.onLine ? 'none' : 'flex';
  }
  window.addEventListener('online', recargar);
  window.addEventListener('offline', revisarRed);

  // ----- Instalación (Android / PC: botón; iPhone: instrucciones) -----
  const instalada = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
  const esIOS = /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  let eventoInstalar = null;

  function puedeAvisar(){
    try { return !instalada && localStorage.getItem('bxgbAvisoCerrado') !== '1'; } catch (e) { return !instalada; }
  }
  function cerrarAviso(){
    document.getElementById('avisoInstalar').style.display = 'none';
    try { localStorage.setItem('bxgbAvisoCerrado', '1'); } catch (e) {}
  }
  function mostrarAviso(){ if (puedeAvisar()) document.getElementById('avisoInstalar').style.display = 'block'; }

  window.addEventListener('beforeinstallprompt', e => {
    e.preventDefault();
    eventoInstalar = e;
    mostrarAviso();
  });
  async function instalar(){
    if (esIOS) { cerrarAviso(); return; }
    if (!eventoInstalar) return;
    eventoInstalar.prompt();
    await eventoInstalar.userChoice;
    eventoInstalar = null;
    document.getElementById('avisoInstalar').style.display = 'none';
  }
  window.addEventListener('appinstalled', () => { document.getElementById('avisoInstalar').style.display = 'none'; });

  if (esIOS && !instalada) {
    document.getElementById('textoInstalar').innerHTML =
      'En iPhone: toca el botón <b style="display:inline">Compartir</b> (cuadro con flecha ⬆️) y elige ' +
      '<b style="display:inline">"Agregar a pantalla de inicio"</b>.';
    document.getElementById('btnInstalar').textContent = 'Entendido';
    setTimeout(mostrarAviso, 1500);
  }

  // ----- Inicio -----
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(() => {}); });
  }
  revisarRed();
  if (navigator.onLine) marco.src = PORTAL;
</script>
</body>
</html>
